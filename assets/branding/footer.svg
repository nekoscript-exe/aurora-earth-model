<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 960 230" role="img">
<title>AURORA Earth System Intelligence</title>

<rect width="960" height="230" rx="18" fill="#101b29"/>

<g transform="translate(441 12) scale(.6)">

  <defs>
    <linearGradient id="orbit">
      <stop stop-color="#376b9e"/>
      <stop offset="1" stop-color="#69edc5"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="49"
          fill="#101b29" stroke="#294e63"/>
  <ellipse cx="64" cy="64" rx="61" ry="21"
           transform="rotate(-35 64 64)"
           fill="none" stroke="url(#orbit)"
           stroke-width="3"/>
  <path d="M41 94 L64 29 L87 94 M49 72 H79"
        fill="none" stroke="#e7fff8"
        stroke-width="5" stroke-linejoin="round"/>
  <circle cx="110" cy="28" r="5" fill="#83f1cc"/>

</g>

<g text-anchor="middle" font-family="Arial,sans-serif">

<text x="480" y="119" fill="#e7fff8"
font-size="31" font-weight="bold"
letter-spacing="7">A.U.R.O.R.A.</text>

<text x="480" y="149" fill="#69edc5"
font-size="14" letter-spacing="3">
EARTH SYSTEM INTELLIGENCE</text>

<text x="480" y="186" fill="#b5c9d6"
font-size="17">
Three minds. One planet. A shared vision.</text>

<text x="480" y="211" fill="#83f1cc"
font-size="11" letter-spacing="2">
BUILT FOR SCIENTIFIC DISCOVERY</text>

</g>

<path d="M60 149 H300 M660 149 H900"
stroke="#376b9e"/>

</svg>
